<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Smith Food Spending</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>Smith College Food Spending: Local vs Non-Local</h2>
    <div id="chart"></div>

    <div class="pie-chart-container">
        <div class="pie-chart-card">
            <h3 id="pie-title">Real vs Not Real Spend</h3>

            <!-- selector -->
            <select id="pie-selector">
                <option value="real">Real vs Not Real</option>
                <option value="breakdown">REAL Breakdown</option>
            </select>

            <!-- ONE container only -->
            <div id="pie-chart"></div>
        </div>
    </div>
    <tooltip id="tooltip"></tooltip>

    <script src="script.js"></script>
</body>

</html>
